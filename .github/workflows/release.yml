# Publie une Release GitHub avec l'APK signé à chaque tag de version.
# Pour sortir une version :  git tag v1.2.0  puis  git push origin v1.2.0
# Secrets requis (Settings > Secrets and variables > Actions) :
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cadence-app/package-lock.json

      - name: Préparer l'app web et Capacitor
        working-directory: cadence-app
        run: |
          npm ci
          node build-www.js
          npx cap sync android

      - name: Construire l'APK signé
        working-directory: cadence-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cadence-release.jks"
          export CADENCE_KEYSTORE="$RUNNER_TEMP/cadence-release.jks"
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="$((GITHUB_RUN_NUMBER + 1))"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Cadence-$GITHUB_REF_NAME.apk"
          rm -f "$CADENCE_KEYSTORE"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: Cadence-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## Installer Cadence
            1. Sur ton téléphone Android, télécharge **Cadence-${{ github.ref_name }}.apk** ci-dessous.
            2. Ouvre le fichier. Si Android le demande, autorise l'installation depuis cette source.
            3. Pour une mise à jour, installe simplement par-dessus : tes données sont conservées.
